version: '3.8'

services:
  clawd-code:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clawd-code
    restart: unless-stopped
    ports:
      - "8765:8765"  # WebSocket 远程访问
    volumes:
      # 挂载工作目录（可选，用于访问宿主机文件）
      - ./workspace:/workspace:rw
      # 持久化 Clawd 数据
      - clawd-data:/app/.clawd
      # 日志
      - ./logs:/app/logs
    environment:
      # OpenAI API 配置
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}

      # Anthropic API 配置
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-opus-20240229}

      # 日志配置
      - CLAWD_LOG_LEVEL=${CLAWD_LOG_LEVEL:-info}
      - CLAWD_ENV=${CLAWD_ENV:-production}

      # 工作目录
      - CLAWD_WORKDIR=/workspace
      # 容器内必须绑全部网卡，否则端口映射/健康检查都不通（服务默认绑 127.0.0.1）
      - AGENT_SERVER_HOST=0.0.0.0
      # 数据目录走挂载卷，重启/升级不丢（与桌面端同一套 CLAWD_DATA_DIR 入口）
      - CLAWD_DATA_DIR=/app/.clawd
    stdin_open: true
    tty: true
    # 服务容器必须跑 `serve`（Host 服务）：
    # Dockerfile 的默认 CMD 是交互式 `chat`，它**不监听任何端口** ——
    # 所以此前声明的 8765 端口映射与健康检查都是摆设（"远程访问"不成立）。
    command: ["serve", "--port", "8765", "--workdir", "/workspace"]
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    # 健康检查：打真实存活端点（/healthz 免 token，只回答"进程还在跑"）
    # 旧写法 `python -c "sys.exit(0)"` 无论服务死活都返回 0，等于没有健康检查。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  clawd-data:
    driver: local
