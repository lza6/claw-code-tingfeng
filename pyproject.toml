[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawd-code"
version = "0.76.7"
description = "AI 编程代理框架 - 多 LLM 提供商 + 工具调用 + RAG + WebSocket 远程访问"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Clawd Code Contributors"},
]
keywords = ["ai", "agent", "llm", "coding", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "openai>=2.30.0",
    "anthropic>=0.40.0",
    # 生产 LLM 栈直接 import（src/llm/litellm_singleton、lazy_litellm、
    # exception_handler、src/utils/voice.py、src/tools_runtime/voice_tool.py）。
    # 此前只写在 requirements.txt、漏在 pyproject，导致 `pip install -e .`
    # 装出的环境一跑 E2E 就 ImportError（2026-10-23 实测）。
    "litellm>=1.40.0",
    # litellm >= 1.100 的 function-calling 路径会 import mcp；
    # 未声明时工具调用直接抛 ModuleNotFoundError（2026-10-23 E2E 实测，步骤 3 失败）。
    "mcp>=1.0.0",
    # 以下三个在生产路径上被硬 import，但历史上从未声明（import_sweep 的
    # DEP-MISSING 列表暴露）：resource_monitor.py、liveness.py、swarm/engine.py
    # 用 psutil；cli/web_config.py 用 fastapi + uvicorn（由 `clawd config` 触发）。
    "psutil>=5.9",
    "fastapi>=0.104",
    "uvicorn>=0.30",
    "websockets>=15.0.1",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",  # 用于通知系统异步HTTP请求
    "rich>=13.7.0",
    "textual>=0.47.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "gitpython>=3.1.0",
    "typer>=0.12.0",
    "prompt-toolkit>=3.0.40",
    "pyyaml>=6.0.1",
    "jinja2>=3.0.0",
    "loguru>=0.7.0",  # 核心模块（api_key_manager/health_check/middleware 等）直接 import
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0; python_version < '3.11'",
    "toml>=0.10.2",  # config/generator.py 与 hooks_config.py 在所有版本都 import
    # 以下两个被 src/background/* 硬 import（celery_app.py / tasks/*.py）。
    # 此前只在 requirements.txt 声明，`pip install -e .` 装出的环境导入必失败
    # （2026-10-29 审计 P2-7 实测：reachability 不可达只是掩盖了它）。
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
# LSP 代码智能（clawd 的 LSPTool 需要本机有语言服务器；不装则工具如实报"未安装"）
lsp = [
    "python-lsp-server>=1.10",
    "pyflakes>=3.0",
    "jedi>=0.19",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "coverage>=7.0",
    "ruff>=0.6.0",
    # 测试期依赖：tests/memory/test_faiss_store.py 顶层 import numpy。
    # 未声明时干净环境 `pytest --collect-only` 直接 1 error（2026-10-23 CI 门禁实测），
    # 而本机因为系统 Python 装过 numpy 所以看不见这个失败。
    "numpy>=1.24",
]
voice = [
    "pydub>=0.25",
    "sounddevice>=0.4",
    "soundfile>=0.11",
]
watch = [
    "watchfiles>=0.20",
    "pathspec>=0.12",
    "grep-ast>=0.3",
]
scrape = [
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
]
clipboard = [
    "pyperclip>=1.8",
]
tracing = [
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "opentelemetry-instrumentation-logging>=0.50.0",
    "langfuse>=0.50.0",
]
all-extras = [
    "clawd-code[voice,watch,scrape,clipboard]",
]


[project.scripts]
clawd = "src.cli.entrypoint:main"

[tool.setuptools.packages.find]
# `prompts` 必须一起装：`clawd review` 的角色模板来自 prompts/agents/*.md，
# 只装 src* 的话非 editable 安装下 review 会直接报「找不到角色模板」
include = ["src*", "prompts*"]

[tool.setuptools.package-data]
"src.eval" = ["datasets/*.json"]
"prompts.agents" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
# 本机/CI 环境里装了不少与本项目无关的 pytest 插件（langsmith/seleniumbase/faker/flask），
# 它们会在每次 pytest 启动时自动导入，实测拖慢收集（langsmith ~12s 累计）。
# 本项目测试不依赖这些插件，显式禁用；需要时可在命令行 `-p <name>` 重新启用。
addopts = "-p no:langsmith_plugin -p no:seleniumbase -p no:faker -p no:flask"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ["node_modules", ".git", "__pycache__", "dist", ".venv", "venv"]
# 注册自定义 mark，消除 PytestUnknownMarkWarning
markers = [
    "integration: 集成测试（跨模块，较慢）",
    "performance: 性能基准测试（默认不参与常规运行）",
    "slow: 慢速测试",
    "e2e: 端到端测试（可能需要真实网络/凭证）",
    "unit: 单元测试",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
# 覆盖率门禁：**必须放在 [tool.coverage.report]**，放在 [tool.coverage.run] 会被
# coverage 当成未知配置项忽略（2026-10-23 实测 warning：
# "Unrecognized option '[tool.coverage.run] fail_under='"）。
# 也就是说 v0.53.0 起这条 60% 阈值从未真正生效过 —— 真正生效的是 CI 里
# 硬编码的 --cov-fail-under=45。
#
# 2026-10-23 修正为**唯一来源 + 真实可执行**：
#   - 实测基线 47.44%（26,861 / 56,624），阈值设为 47 留出跨平台波动余量；
#   - CI 不再传 --cov-fail-under（避免两处阈值打架）；
#   - 相对"此前真正生效的 45"是**提高**，不是降低标准；
#   - 目标仍是 60（见 计划书/下一步改进指南.md W5），分批提阈值：47 → 50 → 55 → 60。
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
# 显示未覆盖的行号，便于改进测试
show_missing = true
# 按文件排序输出
sort = "Cover"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # do not perform function call in argument defaults
    "SIM108", # use ternary instead of if-else
    "RUF001", # ambiguous unicode character string (Chinese project)
    "RUF002", # ambiguous unicode character docstring (Chinese project)
    "RUF003", # ambiguous unicode character comment (Chinese project)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests
"src/reference_data/*" = ["E501"]  # auto-generated data
"src/cli/textual_dashboard.py" = ["E741"]  # HSL color math (l = lightness)
"src/utils/rich_colors.py" = ["E741"]  # HSL color math (l = lightness)

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
