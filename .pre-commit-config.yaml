# Pre-commit 配置（参考 Onyx 扩展）
# 安装: pip install pre-commit && pre-commit install
# 手动运行: pre-commit run --all-files

repos:
  # 基础检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Mypy 严格检查**不放进 pre-commit**（Quality Checks 里已有独立的 mypy-strict job，
  # 且它显式声明 non-blocking）：存量 391 个文件 / 1600+ 条严格模式报错，
  # 一次性修完是一次大重构不是门禁；放在 pre-commit 里只会让每次提交必红、
  # 开发者用 --no-verify 绕过 —— 门禁反而失效。类型治理走独立 job 渐进收敛。

  # isort 排序导入（Onyx 风格）
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']

  # 自定义密钥检测 hook
  # 自定义密钥检测 hook（脚本实体在 scripts/detect_api_keys.py ——
  # 此前内联在 entry: python -c 里，不是合法 YAML，pre-commit 直接 InvalidConfigError）
  - repo: local
    hooks:
      - id: detect-api-keys
        name: detect-api-keys
        description: '检测常见的 API 密钥模式（OpenAI, Anthropic, Google 等）'
        entry: python scripts/detect_api_keys.py
        language: system
        types: [python]
        exclude: '^(tests/|\.env\.example)'

  # ruff：pre-commit 只跑**硬指标**（F821/F811/E9 —— 与本地/CI 同一把尺子）。
  # 此前这里跑全量规则 + formatter：与 pyproject 的 src=["src","tests"] 口径叠加，
  # 会把 930 个文件重排格式、报 1358 条问题 —— 那是一次性大重构，不是门禁，
  # 且每次提交都"修不完"，Quality Checks 因此永远红。全量 lint 单独跑（见 docs）。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.4
    hooks:
      - id: ruff
        args: [--select, F821,F811,E9, --exit-non-zero-on-fix]
