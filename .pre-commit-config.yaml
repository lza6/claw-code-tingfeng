# Pre-commit 配置（参考 Onyx 扩展）
# 安装: pip install pre-commit && pre-commit install
# 手动运行: pre-commit run --all-files

repos:
  # 基础检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Mypy 类型检查（Onyx 风格）
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [
          --disallow-untyped-defs,
          --disallow-incomplete-defs,
          --check-untyped-defs,
          --strict-optional,
          --warn-return-any,
          --warn-unused-ignores,
        ]
        additional_dependencies: [
          types-requests,
          types-PyYAML,
          types-redis,
          pydantic,
        ]
        files: ^src/

  # isort 排序导入（Onyx 风格）
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']

  # 自定义密钥检测 hook
  # 自定义密钥检测 hook（脚本实体在 scripts/detect_api_keys.py ——
  # 此前内联在 entry: python -c 里，不是合法 YAML，pre-commit 直接 InvalidConfigError）
  - repo: local
    hooks:
      - id: detect-api-keys
        name: detect-api-keys
        description: '检测常见的 API 密钥模式（OpenAI, Anthropic, Google 等）'
        entry: python scripts/detect_api_keys.py
        language: system
        types: [python]
        exclude: '^(tests/|\.env\.example)'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
