name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff (hard errors - blocking)
        run: |
          ruff check src/ tests/ --select F821,F811,E9

      - name: Lint with Ruff (full report - non-blocking)
        continue-on-error: true
        run: |
          ruff check src/ tests/ --statistics


      - name: Format check with Ruff
        continue-on-error: true
        run: |
          ruff format --check src/ tests/

      # ---- 度量门禁（2026-10-23 加入）：把四条硬指标从"人工纪律"变成 CI 强制 ----
      # 背景：H-3（IMPORT-FAIL=0）与 H-4（生产可达数不下降）此前全靠人记着跑，
      # 2026-10-23 实测发现 import_sweep 的归因缺陷让 H-3 失真了整整一轮。

      - name: Collect gate (pytest --collect-only must have 0 errors)
        run: |
          pytest tests/ --collect-only -q

      - name: Import integrity gate (IMPORT-FAIL = 0, IMPORT-EXIT = 0)
        run: |
          python scripts/import_sweep.py --strict-exit

      - name: Reachability gate (production-reachable modules must not drop)
        run: |
          # 阈值不在此处硬编码：默认值来自 scripts/hard_metrics.py 的 MIN_REACHABLE
          python scripts/reachability.py

      - name: Silent-exception trend gate (must not exceed baseline)
        run: |
          # 默认阈值来自 scripts/hard_metrics.py 的 MAX_SILENT_EXCEPT
          python scripts/check_silent_except.py

      # 启动预算门禁（X-6）：`clawd --version` / `import src.cli.entrypoint` / 已加载模块数
      # 都是有上限的资源。「每次敲 clawd 多等几百毫秒」这类退化不会被任何功能测试发现，
      # 只有预算门禁能发现。
      # CLAWD_STARTUP_BUDGET_FACTOR=1.8：默认预算是本机 Windows 实测值，共享 runner
      # CPU 更慢/磁盘更抖 → 用宽松系数避免假红（假红会让人把门禁静音）。
      # 模块数是结构量，脚本里刻意**不**乘该系数。
      - name: Startup budget gate
        env:
          CLAWD_STARTUP_BUDGET_FACTOR: "1.8"
        run: |
          python scripts/startup_budget.py --json | tee startup-budget.json

      - name: Type check with MyPy
        run: |
          mypy src/ --ignore-missing-imports --no-error-summary || true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          # 覆盖率阈值**单一来源** = pyproject.toml 的 [tool.coverage.report] fail_under。
          # 此处刻意不传 --cov-fail-under：2026-10-23 前 pyproject 的 fail_under 被放在
          # [tool.coverage.run] 而被 coverage 忽略（从未生效），真正生效的是本文件里
          # 硬编码的 45。现在阈值收敛到 pyproject（47，实测基线 47.44%）。
          pytest tests/ -v --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          # safety 3.x 起 check 子命令要求登录/API key，匿名调用直接报错 →
          # 该 job 会永远红（与真实漏洞无关）。改用 pip-audit（开源、无需鉴权）。
          pip install bandit pip-audit

      - name: Run Bandit security scan
        run: |
          bandit -r src/ -f json -o bandit-report.json \
            --exit-zero \
            --severity-level medium \
            --confidence-level medium

      - name: Check dependencies for vulnerabilities
        run: |
          # 报告类检查：出报告 + 有漏洞时打 warning（阻断判定交给安全审查流程，
          # 与 bandit 步骤口径一致），避免"上游漏洞导致 CI 常红被无视"。
          pip-audit -r requirements.txt --format json -o pip-audit-report.json             || echo "::warning::pip-audit 发现依赖漏洞，见 pip-audit-report.json"
          python -c "import json,pathlib,sys; d=json.loads(pathlib.Path('pip-audit-report.json').read_text()); n=sum(len(x.get('vulns',[])) for x in d) if isinstance(d,list) else 0; print(f'依赖漏洞数: {n}')" || true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t clawd-code:ci-test .

      # 原来的写法是 `docker run --rm clawd-code:ci-test --version || true`：
      # 末尾的 `|| true` 让"镜像根本跑不起来"也算 success。v0.90.0 实测证实这不是假设 ——
      # 镜像能构建、但容器启动即 `ModuleNotFoundError: No module named 'src'`，CI 依然全绿。
      - name: Test Docker image (real import + liveness probe)
        run: |
          docker run --rm clawd-code:ci-test --version
          docker run -d --name clawd-smoke -p 18765:8765 clawd-code:ci-test
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/healthz || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::容器探活失败（/healthz 返回 $code）"
            docker logs clawd-smoke || true
            docker rm -f clawd-smoke || true
            exit 1
          fi
          echo "--- /healthz ---"; curl -s http://127.0.0.1:18765/healthz
          echo "--- /readyz ---";  curl -s http://127.0.0.1:18765/readyz || true
          echo "--- docker healthcheck 状态 ---"
          sleep 20
          docker inspect --format '{{.State.Health.Status}}' clawd-smoke
          docker rm -f clawd-smoke
